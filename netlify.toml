# Netlify Configuration for VELORA Frontend

[build]
  command = "npm --workspace @velora/client run build"
  publish = "client/dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "20"

# Return 404 for unhandled API calls so they do not receive index.html
[[redirects]]
  from = "/api/*"
  to = "/404"
  status = 404

# SPA routing redirect rule so deep links and page refreshes work properly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
